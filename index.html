<meta name="theme-color" content="#4f46e5">

<style>
  :root{
    --bg:#eef2f7; --surface:#ffffff; --primary:#4f46e5; --primary-soft:#eef2ff;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(180deg,#eef2f7 0%,#e8edf5 100%);
    color:var(--text);min-height:100vh;padding-bottom:32px;
  }
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;max-width:1000px;margin:0 auto}
  .logo{width:46px;height:46px;border-radius:14px;flex:0 0 auto;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 16px -6px rgba(79,70,229,.7)}
  .titles h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
  .titles p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:500}
  .controls{max-width:1000px;margin:0 auto;padding:0 16px}
  .search-box{position:relative;display:flex;align-items:center;background:var(--surface);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.25)}
  .search-box .ico{position:absolute;left:14px;width:18px;height:18px;color:var(--muted)}
  #search{flex:1;border:0;background:transparent;outline:none;padding:14px 40px 14px 42px;font-size:15px;color:var(--text);font-family:inherit;border-radius:14px}
  #search::placeholder{color:#94a3b8}
  .clear{position:absolute;right:10px;border:0;background:#f1f5f9;color:var(--muted);width:26px;height:26px;border-radius:50%;font-size:13px;cursor:pointer;line-height:1}
  .results{margin-top:8px;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -12px rgba(15,23,42,.3)}
  .result{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 14px;border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:14px;color:var(--text);border-bottom:1px solid #f1f5f9}
  .result:last-child{border-bottom:0}
  .result:active{background:#f8fafc}
  .result .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .result .meta{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px -6px rgba(79,70,229,.9)}
  .floor-tabs{max-width:1000px;margin:6px auto 10px;padding:0 16px;display:flex;gap:6px;background:transparent;overflow-x:auto;scrollbar-width:none}
  .floor-tabs::-webkit-scrollbar{display:none}
  .floor-tabs button{flex:1;min-width:90px;padding:11px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}
  .floor-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 8px 20px -10px rgba(79,70,229,1)}
  .map-wrap{max-width:1000px;margin:0 auto;padding:8px;background:var(--surface);border-radius:var(--radius);margin-left:16px;margin-right:16px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 14px 40px -20px rgba(15,23,42,.35)}
  @media(min-width:1032px){.map-wrap{margin-left:auto;margin-right:auto}}
  #map{display:block;width:100%;height:auto;border-radius:12px}
  .room{cursor:pointer}
  .room rect{transition:filter .18s,opacity .18s}
  .room:hover rect{filter:brightness(.95)}
  .room.dim{opacity:.18;pointer-events:none}
  .room.active rect{stroke-width:4!important}
  #routeLayer{pointer-events:none}
  .route-line{stroke-dasharray:16 11;animation:dashMove 1.1s linear infinite}
  @keyframes dashMove{to{stroke-dashoffset:-27}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.55);opacity:.85}100%{transform:scale(2.4);opacity:0}}
  .banner{max-width:1000px;margin:12px 16px 0;display:flex;align-items:center;gap:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600}
  @media(min-width:1032px){.banner{margin-left:auto;margin-right:auto}}
  .banner button{margin-left:auto;border:0;background:#f97316;color:#fff;padding:7px 13px;border-radius:9px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;flex:0 0 auto}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:40;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:520px;z-index:50;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -12px 50px -12px rgba(15,23,42,.45);transition:transform .32s cubic-bezier(.22,1,.36,1);max-height:82vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .sheet.open{transform:translate(-50%,0)}
  .grabber{width:42px;height:4px;border-radius:99px;background:#e2e8f0;margin:10px auto 0}
  .sheet-body{padding:16px 20px 4px}
  .sheet-head{display:flex;align-items:flex-start;gap:12px}
  .sheet-icon{width:52px;height:52px;border-radius:16px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:26px}
  .sheet-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
  .badge{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.3px}
  .sheet-desc{margin:14px 0 0;font-size:14px;line-height:1.55;color:#475569}
  .btn-route{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px -10px rgba(79,70,229,1);display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-route:active{transform:scale(.985)}
  .steps{list-style:none;padding:0;margin:18px 0 0}
  .steps li{display:flex;gap:12px;padding:11px 0;font-size:13.5px;line-height:1.5;color:#334155;border-bottom:1px solid #f1f5f9}
  .steps li:last-child{border-bottom:0}
  .step-num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .sheet-close{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;border:0;background:#f1f5f9;color:#64748b;font-size:15px;cursor:pointer;line-height:1;z-index:2}
</style>

/* =========================================================
   2. DURUM VE YARDIMCILAR
   ========================================================= */
let floor = 0;
let activeRoomId = null;
let filterCat = null;
let route = null;
const $ = id => document.getElementById(id);
const mapEl = $('map');

function findRoom(id) {
  for (const f in FLOORS) {
    const r = FLOORS[f].rooms.find(x => x.id === id);
    if (r) return { room: r, floor: Number(f) };
  }
  return null;
}

function dedupe(pts) {
  return pts.filter((p, i) => i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
}

// Odalara sığmayan yazıları akıllıca boyutlandıran ve alt satıra geçiren fonksiyon
function renderText(room, c, cx, cy) {
    if (room.isVertical) {
        return `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="18" transform="translate(0, -30)">${room.icon}</text>
                <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" fill="${c.tx}" transform="rotate(-90 ${cx} ${cy})">${room.name}</text>`;
    }

    const iconSize = room.w < 80 ? 14 : (room.w < 120 ? 18 : 24);
    let fontSize = 12;
    if (room.w < 80) fontSize = 10;
    else if (room.w < 120) fontSize = 11;

    // Eğer oda çok alçaksa (h < 120) ve yazı uzunsa
    if (room.h < 120 && room.name.length > 10) {
        const parts = room.name.split(' ');
        return `<text x="${cx}" y="${cy - 15}" text-anchor="middle" font-size="${iconSize}">${room.icon}</text>
                <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="10" font-weight="800" fill="${c.tx}">${parts[0]}</text>
                <text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="10" font-weight="800" fill="${c.tx}">${parts[1] || ''}</text>`;
    }

    let displayName = room.name;
    const maxChars = Math.floor(room.w / (fontSize * 0.55));
    if (displayName.length > maxChars) {
        displayName = displayName.substring(0, maxChars - 2) + '..';
    }

    return `<text x="${cx}" y="${cy - 10}" text-anchor="middle" font-size="${iconSize}">${room.icon}</text>
            <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="${fontSize}" font-weight="800" fill="${c.tx}">${displayName}</text>`;
}

/* =========================================================
   3. HARİTA ÇİZİMİ
   ========================================================= */
function renderMap() {
  const f = FLOORS[floor];
  let s = '';

  // Bina dış duvarı
  s += `<rect x="20" y="90" width="990" height="640" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="3.5"/>`;
  
  // Koridorlar
  s += `<rect x="490" y="350" width="180" height="300" fill="#eef2ff"/>`;
  s += `<rect x="30" y="350" width="950" height="70" fill="#eef2ff"/>`;
  
  s += `<text x="580" y="520" font-size="14" font-weight="800" fill="#a5b4fc" transform="rotate(-90 580 520)" letter-spacing="4" opacity=".8">ANA KORİDOR</text>`;
  s += `<text x="300" y="392" font-size="14" font-weight="800" fill="#a5b4fc" letter-spacing="4" opacity=".8">YATAY KORİDOR</text>`;

  // Odaları Çiz
  for (const room of f.rooms) {
    const c = CATS[room.cat];
    const isActive = activeRoomId === room.id;
    const isDim = filterCat && filterCat !== room.cat;

    s += `<g class="room${isDim ? ' dim' : ''}${isActive ? ' active' : ''}" data-id="${room.id}">`;
    
    // Oda Kutusu
    s += `<rect x="${room.x}" y="${room.y}" width="${room.w}" height="${room.h}"
            rx="2" fill="${c.bg}" stroke="${c.bd}" stroke-width="2"
            ${isActive ? `stroke="${c.tx}"` : ''}/>`;

    const cx = room.x + room.w / 2;
    const cy = room.y + room.h / 2;

    // Yazıları ekle
    s += renderText(room, c, cx, cy);
    s += `</g>`;
  }

  s += `<g id="routeLayer"></g>`;
  mapEl.innerHTML = s;

  drawRoute();
  attachRoomEvents();
}

/* =========================================================
   4. ROTA (Yol Tarifi)
   ========================================================= */
function drawRoute() {
  const layer = mapEl.querySelector('#routeLayer');
  if (!layer) return;
  let s = '';

  const key = 'floor' + floor;
  const pts = route ? route[key] : null;

  if (pts && pts.length > 1) {
    const str = pts.map(p => p.join(',')).join(' ');

    s += `<polyline points="${str}" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`;
    s += `<polyline points="${str}" fill="none" stroke="#f97316" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" class="route-line"/>`;

    const st = pts[0];
    s += `<circle cx="${st[0]}" cy="${st[1]}" r="9" fill="#22c55e"/>`;
    s += `<circle cx="${st[0]}" cy="${st[1]}" r="9" fill="#22c55e" opacity=".5" class="pulse"/>`;

    const en = pts[pts.length - 1];
    s += `<circle cx="${en[0]}" cy="${en[1]}" r="16" fill="#f97316" opacity=".22"/>`;
    s += `<circle cx="${en[0]}" cy="${en[1]}" r="9" fill="#f97316" stroke="#fff" stroke-width="2.5"/>`;
  }
  layer.innerHTML = s;
}

function computeRoute(room, floorOfRoom) {
  const destX = room.x + room.w / 2;
  const destY = room.y + room.h / 2;

  if (room.id === 'giris') {
    return { floor0: dedupe([GIRIS_NOKTASI, [destX, destY]]), steps: ['Giriş holündesiniz.'], destFloor: 0 };
  }

  if (floorOfRoom === 0) {
    const steps = ['Ana girişten içeri girin.'];
    let route0 = [GIRIS_NOKTASI, [580, 500]]; 
    let hedefX = room.doorX, hedefY = room.doorY;

    if (hedefX < 490) steps.push('Ana koridordan sola dönün.');
    else if (hedefX > 670) steps.push('Ana koridordan sağa dönün.');
    else steps.push('Ana koridorda ilerleyin.');

    if (hedefY < 350) {
      steps.push('Yatay koridora ulaşana kadar ilerleyin.');
      route0.push([580, 385], [hedefX, 385], [hedefX, hedefY]);
    } else if (hedefY >= 350 && hedefY < 420) {
      route0.push([580, 385], [hedefX, 385], [hedefX, hedefY]);
    } else {
      route0.push([hedefX, 500], [hedefX, hedefY]);
    }

    steps.push(`${room.name} kapısına ulaştınız.`);
    route0.push([destX, destY]); 
    return { floor0: dedupe(route0), steps, destFloor: 0 };
  } 
  else if (floorOfRoom === 1) {
    const steps = ['Ana girişten içeri girin.', 'Sağ taraftaki merdivenlere yönelin ve 1. kata çıkın.'];
    const route0 = dedupe([GIRIS_NOKTASI, [580, 500], [640, 500], [640, 570]]);
    let route1 = [KAT1_MERDIVEN]; 
    
    if (room.doorY === 350) {
      steps.push('Merdivenlerden çıkınca yatay koridora girin.');
      const dx = room.doorX - KAT1_MERDIVEN[0];
      if (dx > 10) steps.push('Sağa dönün.');
      else if (dx < -10) steps.push('Sola dönün.');
      route1.push([KAT1_MERDIVEN[0], 385], [room.doorX, 385], [room.doorX, room.doorY]); 
    } else {
      steps.push('Merdivenlerden çıkınca koridora girin.');
      const dx = room.doorX - KAT1_MERDIVEN[0];
      if (dx > 10) steps.push('Sağa dönün.');
      else if (dx < -10) steps.push('Sola dönün.');
      route1.push([room.doorX, KAT1_MERDIVEN[1]], [room.doorX, room.doorY]); 
    }
    steps.push(`${room.name} kapısına ulaştınız.`);
    route1.push([destX, destY]); 
    return { floor0: route0, floor1: dedupe(route1), steps, destFloor: 1 };
  }
  else if (floorOfRoom === 2) {
    const steps = ['Ana girişten içeri girin.', 'Sağdaki merdivenlerden 1. kata çıkın.', 'Aynı merdivenden 2. kata çıkın.'];
    const route0 = dedupe([GIRIS_NOKTASI, [580, 500], [640, 500], [640, 570]]);
    const route1 = dedupe([[640, 420], [640, 350], [550, 350], [550, 420]]);
    let route2 = [KAT2_MERDIVEN]; 
    
    if (room.doorY === 350) {
      steps.push('Merdivenlerden çıkınca yatay koridora girin.');
      const dx = room.doorX - KAT2_MERDIVEN[0];
      if (dx > 10) steps.push('Sağa dönün.');
      else if (dx < -10) steps.push('Sola dönün.');
      route2.push([KAT2_MERDIVEN[0], 385], [room.doorX, 385], [room.doorX, room.doorY]); 
    } else {
      steps.push('Merdivenlerden çıkınca koridora girin.');
      const dx = room.doorX - KAT2_MERDIVEN[0];
      if (dx > 10) steps.push('Sağa dönün.');
      else if (dx < -10) steps.push('Sola dönün.');
      route2.push([room.doorX, KAT2_MERDIVEN[1]], [room.doorX, room.doorY]); 
    }
    steps.push(`${room.name} kapısına ulaştınız.`);
    route2.push([destX, destY]); 
    return { floor0: route0, floor1: route1, floor2: dedupe(route2), steps, destFloor: 2 };
  }
  else if (floorOfRoom === 3) {
    const steps = ['Ana girişten içeri girin.', 'Sağdaki merdivenlerden 1. kata çıkın.', '2. kata çıkın.', 'Son olarak 3. kata çıkın.'];
    const route0 = dedupe([GIRIS_NOKTASI, [580, 500], [640, 500], [640, 570]]);
    const route1 = dedupe([[640, 420], [640, 350], [550, 350], [550, 420]]);
    const route2 = dedupe([[550, 420], [550, 350], [460, 350], [460, 420]]); 
    let route3 = [KAT3_MERDIVEN]; 
    
    if (room.doorY === 350) {
      steps.push('Merdivenlerden çıkınca yatay koridora girin.');
      const dx = room.doorX - KAT3_MERDIVEN[0];
      if (dx > 10) steps.push('Sağa dönün.');
      else if (dx < -10) steps.push('Sola dönün.');
      route3.push([KAT3_MERDIVEN[0], 385], [room.doorX, 385], [room.doorX, room.doorY]); 
    } else {
      steps.push('Merdivenlerden çıkınca koridora girin.');
      const dx = room.doorX - KAT3_MERDIVEN[0];
      if (dx > 10) steps.push('Sağa dönün.');
      else if (dx < -10) steps.push('Sola dönün.');
      route3.push([room.doorX, KAT3_MERDIVEN[1]], [room.doorX, room.doorY]); 
    }
    steps.push(`${room.name} kapısına ulaştınız.`);
    route3.push([destX, destY]); 
    return { floor0: route0, floor1: route1, floor2: route2, floor3: dedupe(route3), steps, destFloor: 3 };
  }
}

/* =========================================================
   5. ETKİLEŞİM VE ARAYÜZ
   ========================================================= */
function attachRoomEvents() {
  mapEl.querySelectorAll('.room').forEach(el => {
    el.addEventListener('click', () => openRoom(el.dataset.id, floor));
  });
}

const sheet = $('sheet'), overlay = $('overlay'), sheetBody = $('sheetBody');

function openRoom(id, floorOfRoom) {
  const found = findRoom(id);
  if (!found) return;
  const { room } = found;
  const c = CATS[room.cat];

  activeRoomId = id;
  renderMap();

  sheetBody.innerHTML = `
    <div class="sheet-head">
      <div class="sheet-icon" style="background:${c.bg};color:${c.tx}">${room.icon}</div>
      <div>
        <h2>${room.name}</h2>
        <span class="badge" style="background:${c.bg};color:${c.tx}">${c.label} · ${FLOORS[floorOfRoom].name}</span>
      </div>
    </div>
    <p class="sheet-desc">${room.desc}</p>
    <button class="btn-route" id="btnRoute">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      Yol Tarifi Al
    </button>
    <div id="stepsBox"></div>
  `;

  $('btnRoute').addEventListener('click', () => {
    route = computeRoute(room, floorOfRoom);
    floor = route.destFloor;
    syncFloorTabs();
    renderMap();
    showSteps(route.steps);
    showBanner(route.destFloor > 0 ? `Yol tarifi aktif · Hedef ${route.destFloor}. katta` : 'Yol tarifi aktif');
    setTimeout(() => { if (sheet) sheet.scrollTo({ top: 0, behavior: 'smooth' }); }, 60);
  });

  sheet.classList.add('open');
  overlay.hidden = false;
  sheet.scrollTop = 0;
}

function showSteps(steps) {
  const box = $('stepsBox');
  if (!box) return;
  let html = '<ol class="steps">';
  steps.forEach((t, i) => { html += `<li><span class="step-num">${i + 1}</span><span>${t}</span></li>`; });
  html += '</ol>';
  box.innerHTML = html;
}

function closeSheet() {
  sheet.classList.remove('open');
  overlay.hidden = true;
  activeRoomId = null;
  renderMap();
}

$('sheetClose').addEventListener('click', closeSheet);
overlay.addEventListener('click', closeSheet);

const banner = $('banner');
function showBanner(text) { $('bannerText').textContent = text; banner.hidden = false; }
$('bannerClose').addEventListener('click', () => { banner.hidden = true; route = null; renderMap(); });

const floorTabsEl = $('floorTabs');
function buildFloorTabs() {
  let html = '';
  for (const f in FLOORS) {
    html += `<button data-floor="${f}" class="${Number(f) === floor ? 'active' : ''}">${FLOORS[f].name}</button>`;
  }
  floorTabsEl.innerHTML = html;
  floorTabsEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { floor = Number(b.dataset.floor); syncFloorTabs(); renderMap(); });
  });
}
function syncFloorTabs() {
  floorTabsEl.querySelectorAll('button').forEach(b => { b.classList.toggle('active', Number(b.dataset.floor) === floor); });
}

const chipsEl = $('chips');
function buildChips() {
  const used = new Set();
  Object.values(FLOORS).forEach(f => f.rooms.forEach(r => used.add(r.cat)));
  let html = `<button class="chip active" data-cat="">Tümü</button>`;
  Object.keys(CATS).forEach(key => {
    if (!used.has(key)) return;
    html += `<button class="chip" data-cat="${key}">${CATS[key].label}</button>`;
  });
  chipsEl.innerHTML = html;
  chipsEl.querySelectorAll('.chip').forEach(ch => {
    ch.addEventListener('click', () => {
      chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      ch.classList.add('active');
      filterCat = ch.dataset.cat || null;
      renderMap();
    });
  });
}

const searchEl = $('search'), resultsEl = $('results'), clearBtn = $('clearSearch');
function doSearch() {
  const q = searchEl.value.trim().toLowerCase();
  clearBtn.hidden = !q;
  if (!q) { resultsEl.hidden = true; resultsEl.innerHTML = ''; return; }

  const hits = [];
  for (const f in FLOORS) {
    FLOORS[f].rooms.forEach(r => {
      if ((r.name + ' ' + r.desc).toLowerCase().includes(q)) hits.push({ room: r, floor: Number(f) });
    });
  }

  if (!hits.length) {
    resultsEl.innerHTML = `<div class="result" style="cursor:default;color:#94a3b8">Sonuç bulunamadı</div>`;
  } else {
    resultsEl.innerHTML = hits.map(h => {
      const c = CATS[h.room.cat];
      return `<button class="result" data-id="${h.room.id}" data-floor="${h.floor}">
        <span class="dot" style="background:${c.bd}"></span><span>${h.room.name}</span>
        <span class="meta">${FLOORS[h.floor].name}</span></button>`;
    }).join('');
  }
  resultsEl.hidden = false;

  resultsEl.querySelectorAll('.result[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      floor = Number(btn.dataset.floor);
      syncFloorTabs(); renderMap();
      resultsEl.hidden = true; searchEl.value = ''; clearBtn.hidden = true;
      openRoom(btn.dataset.id, floor);
    });
  });
}
searchEl.addEventListener('input', doSearch);
clearBtn.addEventListener('click', () => { searchEl.value = ''; doSearch(); searchEl.focus(); });

buildChips();
buildFloorTabs();
renderMap();
</script>
