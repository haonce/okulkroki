<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Gümüşhacıköy Hasan Coci Anadolu Lisesi · Yön Bulma</title>
<style>
  :root{
    --bg:#eef2f7;
    --surface:#ffffff;
    --primary:#4f46e5;
    --primary-soft:#eef2ff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --route:#f97316;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(180deg,#eef2f7 0%,#e8edf5 100%);
    color:var(--text);min-height:100vh;padding-bottom:32px;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:16px 18px 10px;
    max-width:900px;margin:0 auto;
  }
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;box-shadow:0 6px 16px -6px rgba(79,70,229,.7);
  }
  .titles h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
  .titles p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:500}

  /* ---------- CONTROLS ---------- */
  .controls{max-width:900px;margin:0 auto;padding:0 16px}
  .search-box{
    position:relative;display:flex;align-items:center;
    background:var(--surface);border-radius:14px;
    box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.25);
  }
  .search-box .ico{position:absolute;left:14px;width:18px;height:18px;color:var(--muted)}
  #search{
    flex:1;border:0;background:transparent;outline:none;
    padding:14px 40px 14px 42px;font-size:15px;color:var(--text);
    font-family:inherit;border-radius:14px;
  }
  #search::placeholder{color:#94a3b8}
  .clear{
    position:absolute;right:10px;border:0;background:#f1f5f9;color:var(--muted);
    width:26px;height:26px;border-radius:50%;font-size:13px;cursor:pointer;line-height:1;
  }
  .results{
    margin-top:8px;background:var(--surface);border-radius:14px;overflow:hidden;
    box-shadow:0 10px 30px -12px rgba(15,23,42,.3);
  }
  .result{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:12px 14px;border:0;background:transparent;cursor:pointer;
    font-family:inherit;font-size:14px;color:var(--text);
    border-bottom:1px solid #f1f5f9;
  }
  .result:last-child{border-bottom:0}
  .result:active{background:#f8fafc}
  .result .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .result .meta{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}

  /* ---------- CHIPS ---------- */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:999px;cursor:pointer;transition:.18s;
    white-space:nowrap;
  }
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;
    box-shadow:0 6px 14px -6px rgba(79,70,229,.9)}

  /* ---------- FLOOR TABS ---------- */
  .floor-tabs{
    max-width:900px;margin:6px auto 10px;padding:0 16px;
    display:flex;gap:6px;background:transparent;overflow-x:auto;scrollbar-width:none;
  }
  .floor-tabs::-webkit-scrollbar{display:none}
  .floor-tabs button{
    flex:1;min-width:80px;padding:11px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);font-family:inherit;
    font-weight:700;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .floor-tabs button.active{
    background:var(--primary);color:#fff;border-color:var(--primary);
    box-shadow:0 8px 20px -10px rgba(79,70,229,1);
  }

  /* ---------- MAP ---------- */
  .map-wrap{
    max-width:900px;margin:0 auto;padding:8px;
    background:var(--surface);border-radius:var(--radius);
    margin-left:16px;margin-right:16px;
    box-shadow:0 1px 2px rgba(15,23,42,.06),0 14px 40px -20px rgba(15,23,42,.35);
  }
  @media(min-width:932px){.map-wrap{margin-left:auto;margin-right:auto}}
  #map{display:block;width:100%;height:auto;border-radius:12px}

  .room{cursor:pointer}
  .room rect{transition:filter .18s,opacity .18s}
  .room:hover rect{filter:brightness(.95)}
  .room.dim{opacity:.18;pointer-events:none}
  .room.active rect{stroke-width:4!important}

  #routeLayer{pointer-events:none}
  .route-line{
    stroke-dasharray:16 11;
    animation:dashMove 1.1s linear infinite;
  }
  @keyframes dashMove{to{stroke-dashoffset:-27}}

  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}
  @keyframes pulse{
    0%{transform:scale(.55);opacity:.85}
    100%{transform:scale(2.4);opacity:0}
  }

  /* ---------- BANNER ---------- */
  .banner{
    max-width:900px;margin:12px 16px 0;
    display:flex;align-items:center;gap:10px;
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;
  }
  @media(min-width:932px){.banner{margin-left:auto;margin-right:auto}}
  .banner button{
    margin-left:auto;border:0;background:#f97316;color:#fff;
    padding:7px 13px;border-radius:9px;font-family:inherit;font-weight:700;
    font-size:12px;cursor:pointer;flex:0 0 auto;
  }

  /* ---------- SHEET ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.42);
    backdrop-filter:blur(2px);z-index:40;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);
    width:100%;max-width:520px;z-index:50;
    background:var(--surface);border-radius:24px 24px 0 0;
    box-shadow:0 -12px 50px -12px rgba(15,23,42,.45);
    transition:transform .32s cubic-bezier(.22,1,.36,1);
    max-height:82vh;overflow-y:auto;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }
  .sheet.open{transform:translate(-50%,0)}
  .grabber{width:42px;height:4px;border-radius:99px;background:#e2e8f0;margin:10px auto 0}
  .sheet-body{padding:16px 20px 4px}
  .sheet-head{display:flex;align-items:flex-start;gap:12px}
  .sheet-icon{
    width:52px;height:52px;border-radius:16px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .sheet-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
  .badge{
    display:inline-block;margin-top:5px;font-size:11px;font-weight:800;
    padding:3px 9px;border-radius:99px;letter-spacing:.3px;
  }
  .sheet-desc{margin:14px 0 0;font-size:14px;line-height:1.55;color:#475569}
  .btn-route{
    width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;
    background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    box-shadow:0 10px 24px -10px rgba(79,70,229,1);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-route:active{transform:scale(.985)}
  .steps{list-style:none;padding:0;margin:18px 0 0}
  .steps li{
    display:flex;gap:12px;padding:11px 0;font-size:13.5px;line-height:1.5;
    color:#334155;border-bottom:1px solid #f1f5f9;
  }
  .steps li:last-child{border-bottom:0}
  .step-num{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;
    background:var(--primary-soft);color:var(--primary);
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .sheet-close{
    position:absolute;right:16px;top:16px;width:32px;height:32px;
    border-radius:50%;border:0;background:#f1f5f9;color:#64748b;
    font-size:15px;cursor:pointer;line-height:1;z-index:2;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">🏫</div>
  <div class="titles">
    <h1>Gümüşhacıköy Hasan Coci Anadolu Lisesi</h1>
    <p>Okul Krokisi &amp; Yön Bulma Sistemi</p>
  </div>
</header>

<div class="controls">
  <div class="search-box">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
    </svg>
    <input id="search" type="search" placeholder="Sınıf, laboratuvar, WC ara..." autocomplete="off">
    <button class="clear" id="clearSearch" hidden>✕</button>
  </div>
  <div class="results" id="results" hidden></div>
  <div class="chips" id="chips"></div>
</div>

<div class="floor-tabs" id="floorTabs">
  <!-- Kat sekmeleri JS ile dinamik oluşturulacak -->
</div>

<div class="map-wrap">
  <svg id="map" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div class="banner" id="banner" hidden>
  <span>🧭</span>
  <span id="bannerText">Yol tarifi aktif</span>
  <button id="bannerClose">Kapat</button>
</div>

<div class="overlay" id="overlay" hidden></div>

<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <button class="sheet-close" id="sheetClose">✕</button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
/* =========================================================
   1. VERİ (Excel'den Çıkan Bilgilere Göre Düzenlendi)
   ========================================================= */
const COLS = [50, 230, 410, 590, 770, 950];
const ROW_TOP = { y0: 60,  y1: 330, cy: 195, door: 330 };
const ROW_BOT = { y0: 410, y1: 680, cy: 545, door: 410 };
const CORRIDOR_Y = 370;
const ENTRY = [500, 710];
const HUB_X = 500;

const CATS = {
  sinif:     { label:'Sınıflar',   bg:'#dbeafe', bd:'#bfdbfe', tx:'#1e40af' },
  idari:     { label:'İdari',      bg:'#fae8ff', bd:'#f0d5f7', tx:'#86198f' },
  yemek:     { label:'Kantin',     bg:'#fef3c7', bd:'#fde68a', tx:'#92400e' },
  spor:      { label:'Spor',       bg:'#dcfce7', bd:'#bbf7d0', tx:'#166534' },
  kutuphane: { label:'Kütüphane',  bg:'#e0e7ff', bd:'#c7d2fe', tx:'#3730a3' },
  wc:        { label:'WC',         bg:'#e2e8f0', bd:'#cbd5e1', tx:'#475569' },
  saglik:    { label:'Sağlık',     bg:'#ffe4e6', bd:'#fecdd3', tx:'#9f1239' },
  lab:       { label:'Laboratuvar',bg:'#fef08a', bd:'#fde047', tx:'#854d0e' },
  diger:     { label:'Diğer',      bg:'#f1f5f9', bd:'#e2e8f0', tx:'#475569' }
};

// Excel'de net olan yerler işaretlendi. Diğerleri standart lise düzenine göre yerleştirildi.
const FLOORS = {
  0: {
    name: 'Zemin Kat',
    rooms: [
      { id:'s9a', name:'9/A Sınıfı', cat:'sinif', col:0, row:'top', icon:'📚', desc:'Zemin kat sınıfı.' },
      { id:'s9b', name:'9/B Sınıfı', cat:'sinif', col:1, row:'top', icon:'📚', desc:'Zemin kat sınıfı.' },
      { id:'mudur', name:'Müdür Odası', cat:'idari', col:2, row:'top', icon:'🗂️', desc:'Okul idaresi.' },
      { id:'ogretmenler', name:'Öğretmenler Odası', cat:'idari', col:3, row:'top', icon:'☕', desc:'Öğretmenler dinlenme alanı.' },
      { id:'kutuphane', name:'Kütüphane', cat:'kutuphane', col:4, row:'top', icon:'📖', desc:'Kitap ödünç alma alanı.' },

      { id:'kantin', name:'Kantin', cat:'yemek', col:0, row:'bottom', icon:'🍽️', desc:'Yiyecek ve içecek satış noktası.' },
      { id:'wc0', name:'WC', cat:'wc', col:1, row:'bottom', icon:'🚻', desc:'Zemin kat tuvaletleri.' },
      { id:'giris', name:'Giriş Holü', cat:'diger', col:2, row:'bottom', icon:'🚪', desc:'Ana giriş ve karşılama alanı.' },
      { id:'revir', name:'Revir', cat:'saglik', col:3, row:'bottom', icon:'🩺', desc:'Sağlık odası.' },
      { id:'spor', name:'Spor Salonu', cat:'spor', col:4, row:'bottom', icon:'🏀', desc:'Kapalı spor salonu.' }
    ]
  },
  1: {
    name: '1. Kat',
    rooms: [
      { id:'s10a', name:'10/A Sınıfı', cat:'sinif', col:0, row:'top', icon:'📚', desc:'1. kat sınıfı.' },
      { id:'s10b', name:'10/B Sınıfı', cat:'sinif', col:1, row:'top', icon:'📚', desc:'Excel krokinde belirtilen 10/B sınıfı.' },
      { id:'s11a', name:'11/A Sınıfı', cat:'sinif', col:2, row:'top', icon:'📚', desc:'1. kat sınıfı.' },
      { id:'s11b', name:'11/B Sınıfı', cat:'sinif', col:3, row:'top', icon:'📚', desc:'1. kat sınıfı.' },
      { id:'fizik', name:'Fizik Lab.', cat:'lab', col:4, row:'top', icon:'🔬', desc:'Fizik laboratuvarı.' },

      { id:'s9c', name:'9/C Sınıfı', cat:'sinif', col:0, row:'bottom', icon:'📚', desc:'1. kat sınıfı.' },
      { id:'s9d', name:'9/D Sınıfı', cat:'sinif', col:1, row:'bottom', icon:'📚', desc:'1. kat sınıfı.' },
      { id:'merdiven1', name:'Merdivenler', cat:'diger', col:2, row:'bottom', icon:'🪜', desc:'Katlar arası geçiş.' },
      { id:'wc1', name:'WC', cat:'wc', col:3, row:'bottom', icon:'🚻', desc:'1. kat tuvaletleri.' },
      { id:'konferans', name:'Konferans Salonu', cat:'diger', col:4, row:'bottom', icon:'🎤', desc:'Toplantı ve sunum salonu.' }
    ]
  },
  2: {
    name: '2. Kat',
    rooms: [
      { id:'s11c', name:'11/C Sınıfı', cat:'sinif', col:0, row:'top', icon:'📚', desc:'2. kat sınıfı.' },
      { id:'kodlama', name:'Kodlama Atölyesi', cat:'lab', col:1, row:'top', icon:'💻', desc:'Excel krokinde belirtilen Kodlama Atölyesi.' },
      { id:'kimya', name:'Kimya Lab.', cat:'lab', col:2, row:'top', icon:'⚗️', desc:'Kimya laboratuvarı.' },
      { id:'biyoloji', name:'Biyoloji Lab.', cat:'lab', col:3, row:'top', icon:'🧬', desc:'Biyoloji laboratuvarı.' },
      { id:'resim', name:'Resim Sınıfı', cat:'sinif', col:4, row:'top', icon:'🎨', desc:'Görsel sanatlar dersliği.' },

      { id:'s12a', name:'12/A Sınıfı', cat:'sinif', col:0, row:'bottom', icon:'📚', desc:'2. kat sınıfı.' },
      { id:'s12b', name:'12/B Sınıfı', cat:'sinif', col:1, row:'bottom', icon:'📚', desc:'2. kat sınıfı.' },
      { id:'merdiven2', name:'Merdivenler', cat:'diger', col:2, row:'bottom', icon:'🪜', desc:'Katlar arası geçiş.' },
      { id:'wc2', name:'WC', cat:'wc', col:3, row:'bottom', icon:'🚻', desc:'2. kat tuvaletleri.' },
      { id:'muzik', name:'Müzik Sınıfı', cat:'sinif', col:4, row:'bottom', icon:'🎵', desc:'Müzik dersliği.' }
    ]
  },
  3: {
    name: '3. Kat',
    rooms: [
      { id:'s12c', name:'12/C Sınıfı', cat:'sinif', col:0, row:'top', icon:'📚', desc:'Excel krokinde belirtilen 12/C sınıfı.' },
      { id:'s12d', name:'12/D Sınıfı', cat:'sinif', col:1, row:'top', icon:'📚', desc:'3. kat sınıfı.' },
      { id:'tarih', name:'Tarih Sınıfı', cat:'sinif', col:2, row:'top', icon:'🏛️', desc:'Tarih dersliği.' },
      { id:'cografya', name:'Coğrafya Sınıfı', cat:'sinif', col:3, row:'top', icon:'🌍', desc:'Coğrafya dersliği.' },
      { id:'matematik', name:'Matematik Sınıfı', cat:'sinif', col:4, row:'top', icon:'📐', desc:'Matematik dersliği.' },

      { id:'depo', name:'Depo', cat:'diger', col:0, row:'bottom', icon:'📦', desc:'Excel krokinde belirtilen Depo.' },
      { id:'arsiv', name:'Arşiv', cat:'diger', col:1, row:'bottom', icon:'🗄️', desc:'Evrak arşivi.' },
      { id:'merdiven3', name:'Merdivenler', cat:'diger', col:2, row:'bottom', icon:'🪜', desc:'Katlar arası geçiş.' },
      { id:'wc3', name:'WC', cat:'wc', col:3, row:'bottom', icon:'🚻', desc:'3. kat tuvaletleri.' },
      { id:'mezunlar', name:'Mezunlar Odası', cat:'idari', col:4, row:'bottom', icon:'🎓', desc:'Mezunlar derneği alanı.' }
    ]
  }
};

/* =========================================================
   2. DURUM
   ========================================================= */
let floor = 0;
let activeRoomId = null;
let filterCat = null;
let route = null;          // { floor0:[pts]|null, floor1:[pts]|null, steps:[], destFloor }

/* =========================================================
   3. YARDIMCILAR
   ========================================================= */
const $ = id => document.getElementById(id);
const mapEl = $('map');

function roomGeom(room) {
  const x0 = COLS[room.col];
  const x1 = COLS[room.col + 1];
  const r  = room.row === 'top' ? ROW_TOP : ROW_BOT;
  return {
    x0, x1, y0: r.y0, y1: r.y1,
    cx: (x0 + x1) / 2,
    cy: r.cy,
    door: r.door,
    w: x1 - x0,
    h: r.y1 - r.y0
  };
}

function findRoom(id) {
  for (const f of Object.keys(FLOORS)) {
    const r = FLOORS[f].rooms.find(x => x.id === id);
    if (r) return { room: r, floor: Number(f) };
  }
  return null;
}

function wrapName(name) {
  if (name.length <= 15) return [name];
  const words = name.split(' ');
  if (words.length < 2) return [name];
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' ');
    const b = words.slice(i).join(' ');
    const score = Math.max(a.length, b.length);
    if (!best || score < best.score) best = { a, b, score };
  }
  return [best.a, best.b];
}

function dedupe(pts) {
  return pts.filter((p, i) =>
    i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]
  );
}

/* =========================================================
   4. HARİTA ÇİZİMİ
   ========================================================= */
function renderMap() {
  const f = FLOORS[floor];
  let s = '';

  /* Bina zemini + koridor */
  s += `<rect x="50" y="60" width="900" height="620" rx="14" fill="#f8fafc"/>`;
  s += `<rect x="50" y="330" width="900" height="80" fill="#eef2ff"/>`;
  s += `<text x="285" y="377" font-size="13" font-weight="800" fill="#a5b4fc"
          letter-spacing="4" opacity=".8">ANA KORİDOR</text>`;

  /* Odalar */
  for (const room of f.rooms) {
    const g  = roomGeom(room);
    const c  = CATS[room.cat];
    const isActive = activeRoomId === room.id;
    const isDim = filterCat && filterCat !== room.cat;

    s += `<g class="room${isDim ? ' dim' : ''}${isActive ? ' active' : ''}" data-id="${room.id}">`;

    /* kapı boşluğu */
    s += `<rect x="${g.cx - 24}" y="${g.door - 6}" width="48" height="12"
            rx="2" fill="${c.bg}"/>`;

    /* oda kutusu */
    s += `<rect x="${g.x0 + 5}" y="${g.y0 + 5}" width="${g.w - 10}" height="${g.h - 10}"
            rx="9" fill="${c.bg}" stroke="${c.bd}" stroke-width="2.5"
            ${isActive ? `stroke="${c.tx}"` : ''}/>`;

    /* ikon */
    s += `<text x="${g.cx}" y="${g.cy - 24}" text-anchor="middle"
            font-size="30">${room.icon}</text>`;

    /* isim */
    const lines = wrapName(room.name);
    if (lines.length === 1) {
      s += `<text x="${g.cx}" y="${g.cy + 14}" text-anchor="middle"
              font-size="14.5" font-weight="800" fill="${c.tx}">${lines[0]}</text>`;
    } else {
      s += `<text x="${g.cx}" y="${g.cy + 4}" text-anchor="middle"
              font-size="14.5" font-weight="800" fill="${c.tx}">${lines[0]}</text>`;
      s += `<text x="${g.cx}" y="${g.cy + 24}" text-anchor="middle"
              font-size="14.5" font-weight="800" fill="${c.tx}">${lines[1]}</text>`;
    }

    s += `</g>`;
  }

  /* Bina dış duvarı */
  s += `<rect x="50" y="60" width="900" height="620" rx="14"
          fill="none" stroke="#94a3b8" stroke-width="3.5"/>`;

  /* Ana giriş kapısı (zemin kat) */
  if (floor === 0) {
    s += `<rect x="474" y="674" width="52" height="14" fill="#f8fafc"/>`;
    s += `<rect x="474" y="674" width="52" height="14" fill="none"
            stroke="#94a3b8" stroke-width="3.5"/>`;
    s += `<text x="500" y="716" text-anchor="middle" font-size="13"
            font-weight="800" fill="#64748b" letter-spacing="1">ANA GİRİŞ</text>`;
  }

  /* Rota katmanı */
  s += `<g id="routeLayer"></g>`;

  mapEl.innerHTML = s;

  drawRoute();
  attachRoomEvents();
}

/* =========================================================
   5. ROTA
   ========================================================= */
function drawRoute() {
  const layer = mapEl.querySelector('#routeLayer');
  if (!layer) return;
  let s = '';

  const key = 'floor' + floor;
  const pts = route ? route[key] : null;

  if (pts && pts.length > 1) {
    const str = pts.map(p => p.join(',')).join(' ');

    s += `<polyline points="${str}" fill="none" stroke="#ffffff"
            stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
            opacity=".95"/>`;
    s += `<polyline points="${str}" fill="none" stroke="#f97316"
            stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"
            class="route-line"/>`;

    const st = pts[0];
    s += `<circle cx="${st[0]}" cy="${st[1]}" r="9" fill="#22c55e"/>`;
    s += `<circle cx="${st[0]}" cy="${st[1]}" r="9" fill="#22c55e" opacity=".5" class="pulse"/>`;
    s += `<circle cx="${st[0]}" cy="${st[1]}" r="14" fill="none" stroke="#16a34a" stroke-width="2.5" opacity=".55"/>`;

    const en = pts[pts.length - 1];
    s += `<circle cx="${en[0]}" cy="${en[1]}" r="16" fill="#f97316" opacity=".22"/>`;
    s += `<circle cx="${en[0]}" cy="${en[1]}" r="9" fill="#f97316" stroke="#fff" stroke-width="2.5"/>`;
  }

  layer.innerHTML = s;
}

function computeRoute(room, floorOfRoom) {
  const g = roomGeom(room);

  if (room.id === 'giris') {
    return {
      floor0: dedupe([ENTRY, [500, 545]]),
      steps: ['Ana girişten içeri girdiğinizde giriş holündesiniz.'],
      destFloor: 0
    };
  }

  const steps = ['Ana girişten içeri girin.'];
  let route0 = null;
  let routeOther = null;

  // Zemin kat için rota hesaplaması (girişten koridora)
  route0 = dedupe([ENTRY, [500, CORRIDOR_Y]]);

  if (floorOfRoom === 0) {
    steps.push('Giriş holünden geçip ana koridora çıkın.');
    const dx = g.cx - HUB_X;
    if (Math.abs(dx) > 10) {
      const m = Math.max(5, Math.round(Math.abs(dx) / 12));
      steps.push(`Ana koridorda ${dx > 0 ? 'sağa' : 'sola'} dönün ve yaklaşık ${m} metre ilerleyin.`);
    }
    const side = room.row === 'top' ? (dx >= 0 ? 'solunuzda' : 'sağınızda') : (dx >= 0 ? 'sağınızda' : 'solunuzda');
    steps.push(Math.abs(dx) <= 10 ? `${room.name} karşınızda olacak.` : `${room.name} ${side} kalacak. Kapısından girin.`);

    route0.push([g.cx, CORRIDOR_Y], [g.cx, g.door], [g.cx, g.cy]);
    route0 = dedupe(route0);

    return { floor0: route0, steps, destFloor: 0 };
  } 
  else {
    // 1, 2 veya 3. katlar için
    steps.push(`Giriş holündeki merdivenlerden ${floorOfRoom}. kata çıkın.`);
    steps.push(`${floorOfRoom}. kattaki ana koridora çıkın.`);

    const dx = g.cx - HUB_X;
    if (Math.abs(dx) > 10) {
      const m = Math.max(5, Math.round(Math.abs(dx) / 12));
      steps.push(`Ana koridorda ${dx > 0 ? 'sağa' : 'sola'} dönün ve yaklaşık ${m} metre ilerleyin.`);
    }
    const side = room.row === 'top' ? (dx >= 0 ? 'solunuzda' : 'sağınızda') : (dx >= 0 ? 'sağınızda' : 'solunuzda');
    steps.push(Math.abs(dx) <= 10 ? `${room.name} karşınızda olacak.` : `${room.name} ${side} kalacak. Kapısından girin.`);

    // Üst kat rota çizimi
    routeOther = dedupe([
      [500, 545], // Merdiven çıkışı varsayımı
      [500, CORRIDOR_Y],
      [g.cx, CORRIDOR_Y],
      [g.cx, g.door],
      [g.cx, g.cy]
    ]);

    return { 
      floor0: route0, 
      ['floor' + floorOfRoom]: routeOther, 
      steps, 
      destFloor: floorOfRoom 
    };
  }
}

/* =========================================================
   6. ODA TIKLAMA
   ========================================================= */
function attachRoomEvents() {
  mapEl.querySelectorAll('.room').forEach(el => {
    el.addEventListener('click', () => openRoom(el.dataset.id, floor));
  });
}

/* =========================================================
   7. ALT PANEL
   ========================================================= */
const sheet = $('sheet');
const overlay = $('overlay');
const sheetBody = $('sheetBody');

function openRoom(id, floorOfRoom) {
  const found = findRoom(id);
  if (!found) return;
  const { room } = found;
  const c = CATS[room.cat];

  activeRoomId = id;
  renderMap();

  sheetBody.innerHTML = `
    <div class="sheet-head">
      <div class="sheet-icon" style="background:${c.bg};color:${c.tx}">${room.icon}</div>
      <div>
        <h2>${room.name}</h2>
        <span class="badge" style="background:${c.bg};color:${c.tx}">
          ${c.label} · ${FLOORS[floorOfRoom].name}
        </span>
      </div>
    </div>
    <p class="sheet-desc">${room.desc}</p>
    <button class="btn-route" id="btnRoute">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l19-9-9 19-2-8-8-2z"/>
      </svg>
      Yol Tarifi Al
    </button>
    <div id="stepsBox"></div>
  `;

  $('btnRoute').addEventListener('click', () => {
    route = computeRoute(room, floorOfRoom);
    floor = route.destFloor;
    syncFloorTabs();
    renderMap();
    showSteps(route.steps);
    showBanner(route.destFloor > 0 ? `Yol tarifi aktif · Hedef ${route.destFloor}. katta` : 'Yol tarifi aktif');

    setTimeout(() => { if (sheet) sheet.scrollTo({ top: 0, behavior: 'smooth' }); }, 60);
  });

  sheet.classList.add('open');
  overlay.hidden = false;
  sheet.scrollTop = 0;
}

function showSteps(steps) {
  const box = $('stepsBox');
  if (!box) return;
  let html = '<ol class="steps">';
  steps.forEach((t, i) => {
    html += `<li><span class="step-num">${i + 1}</span><span>${t}</span></li>`;
  });
  html += '</ol>';
  box.innerHTML = html;
}

function closeSheet() {
  sheet.classList.remove('open');
  overlay.hidden = true;
  activeRoomId = null;
  renderMap();
}

$('sheetClose').addEventListener('click', closeSheet);
overlay.addEventListener('click', closeSheet);

/* =========================================================
   8. BANNER
   ========================================================= */
const banner = $('banner');
function showBanner(text) {
  $('bannerText').textContent = text;
  banner.hidden = false;
}
$('bannerClose').addEventListener('click', () => {
  banner.hidden = true;
  route = null;
  renderMap();
});

/* =========================================================
   9. KAT SEKMELERİ (Dinamik)
   ========================================================= */
const floorTabsEl = $('floorTabs');

function buildFloorTabs() {
  let html = '';
  for (const f in FLOORS) {
    html += `<button data-floor="${f}" class="${Number(f) === floor ? 'active' : ''}">${FLOORS[f].name}</button>`;
  }
  floorTabsEl.innerHTML = html;

  floorTabsEl.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      floor = Number(b.dataset.floor);
      syncFloorTabs();
      renderMap();
    });
  });
}

function syncFloorTabs() {
  floorTabsEl.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.floor) === floor);
  });
}

/* =========================================================
   10. FİLTRE ÇİPİLERİ
   ========================================================= */
const chipsEl = $('chips');

function buildChips() {
  const used = new Set();
  Object.values(FLOORS).forEach(f => f.rooms.forEach(r => used.add(r.cat)));

  let html = `<button class="chip active" data-cat="">Tümü</button>`;
  Object.keys(CATS).forEach(key => {
    if (!used.has(key)) return;
    html += `<button class="chip" data-cat="${key}">${CATS[key].label}</button>`;
  });
  chipsEl.innerHTML = html;

  chipsEl.querySelectorAll('.chip').forEach(ch => {
    ch.addEventListener('click', () => {
      chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      ch.classList.add('active');
      filterCat = ch.dataset.cat || null;
      renderMap();
    });
  });
}

/* =========================================================
   11. ARAMA
   ========================================================= */
const searchEl = $('search');
const resultsEl = $('results');
const clearBtn = $('clearSearch');

function doSearch() {
  const q = searchEl.value.trim().toLowerCase();
  clearBtn.hidden = !q;

  if (!q) { resultsEl.hidden = true; resultsEl.innerHTML = ''; return; }

  const hits = [];
  for (const f in FLOORS) {
    FLOORS[f].rooms.forEach(r => {
      const hay = (r.name + ' ' + r.desc).toLowerCase();
      if (hay.includes(q)) hits.push({ room: r, floor: Number(f) });
    });
  }

  if (!hits.length) {
    resultsEl.innerHTML = `<div class="result" style="cursor:default;color:#94a3b8">
      Sonuç bulunamadı</div>`;
    resultsEl.hidden = false;
    return;
  }

  resultsEl.innerHTML = hits.map(h => {
    const c = CATS[h.room.cat];
    return `<button class="result" data-id="${h.room.id}" data-floor="${h.floor}">
      <span class="dot" style="background:${c.bd}"></span>
      <span>${h.room.name}</span>
      <span class="meta">${FLOORS[h.floor].name}</span>
    </button>`;
  }).join('');
  resultsEl.hidden = false;

  resultsEl.querySelectorAll('.result[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = Number(btn.dataset.floor);
      floor = f;
      syncFloorTabs();
      renderMap();
      resultsEl.hidden = true;
      searchEl.value = '';
      clearBtn.hidden = true;
      openRoom(btn.dataset.id, f);
    });
  });
}

searchEl.addEventListener('input', doSearch);
clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  doSearch();
  searchEl.focus();
});

/* =========================================================
   12. BAŞLAT
   ========================================================= */
buildChips();
buildFloorTabs();
renderMap();
</script>
</body>
</html>
